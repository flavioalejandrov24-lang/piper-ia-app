<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configura tu IA con Piper</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #764ba2;
            --primary-light: #8e63cf;
            --success: #25d366;
            --bg-gradient: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            padding: 15px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: var(--shadow);
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .view {
            display: none;
            flex-direction: column;
            height: 100%;
            animation: fadeIn 0.3s ease;
        }
        .view.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            padding: 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.8);
            flex-shrink: 0;
        }
        .header h2 { margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--text-main); }
        
        .back-btn { 
            background: #f1f5f9; border: none; cursor: pointer; padding: 8px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); transition: all 0.2s;
        }
        .back-btn:hover { background: var(--border); color: var(--primary); }

        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: thin;
        }

        .field { margin-bottom: 15px; }
        label { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-main); }
        input, textarea, select { 
            width: 100%; padding: 12px; border: 1.5px solid var(--border); 
            border-radius: 10px; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
            background: white;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); }

        .range-group { 
            background: #f8fafc; padding: 10px; border-radius: 10px; 
            display: flex; align-items: center; gap: 12px; margin-top: 4px;
        }
        .range-group input { flex: 1; padding: 0; height: 5px; cursor: pointer; appearance: none; background: #cbd5e1; border: none; }
        .range-group input::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; background: var(--primary); border-radius: 50%; }
        .range-val { min-width: 40px; font-size: 0.85rem; color: var(--primary); font-weight: 800; text-align: right; }

        .model-checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .model-checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: white;
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .model-checkbox-item:hover { border-color: var(--primary); background: #fdfaff; }
        .model-checkbox-left { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
        .model-checkbox-left input { width: auto; margin: 0; cursor: pointer; }
        .model-checkbox-left span { font-size: 0.85rem; font-weight: 600; color: var(--text-main); }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 0.8rem;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-test { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
        .btn-test:hover { background: #bbf7d0; }
        .btn-primary { background: #22c55e; color: white; }
        .btn-primary:hover { background: #16a34a; }
        .btn-secondary { background: #e9d5ff; color: #9333ea; border: 1px solid #d8b4fe; }
        .btn-secondary:hover { background: #ddd6fe; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #avatar-preview-container { 
            width: 110px; height: 110px; margin: 0 auto 15px; 
            border: 3px dashed var(--border); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; cursor: pointer; position: relative;
            background: white;
        }
        #avatar-preview { width: 100%; height: 100%; object-fit: cover; display: none; }
        #preview-placeholder { color: var(--text-muted); text-align: center; font-size: 0.75rem; padding: 10px; }

        .bot-list-grid { display: flex; flex-direction: column; gap: 12px; }
        
        .bot-item {
            background: #fff; 
            border: 1.5px solid var(--border); 
            border-radius: 15px;
            padding: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 12px;
            cursor: pointer; 
            transition: 0.2s; 
            position: relative;
        }
        .bot-item:hover { border-color: var(--primary); background: #fdfaff; }
        
        .bot-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .bot-img-mini { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); flex-shrink: 0; }
        .bot-info-mini { flex: 1; }
        .bot-info-mini h4 { margin: 0; font-size: 1rem; color: var(--text-main); }
        .online-tag { font-size: 0.7rem; color: var(--success); display: flex; align-items: center; gap: 4px; font-weight: bold; }
        .online-dot { width: 7px; height: 7px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }
        
        .btn-delete { 
            background: #fee2e2; 
            color: #ef4444; 
            border: none; 
            padding: 8px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-delete:hover { background: #fecaca; transform: scale(1.1); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; }
        .user-msg { align-self: flex-end; background: #0084ff; color: white; border-bottom-right-radius: 4px; }
        .ia-msg { align-self: flex-start; background: #e2e8f0; color: var(--text-main); border-bottom-left-radius: 4px; }

        .chat-input-box {
            padding: 15px; border-top: 1px solid var(--border);
            display: flex; gap: 10px; background: #fff;
        }

        hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
        .section-title { color: var(--primary); font-size: 0.8rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 15px; display: block; }
        
        .nav-footer {
          padding: 10px 20px;
          border-top: 1px solid var(--border);
          display: flex;
          justify-content: space-around;
          background: #fff;
          flex-shrink: 0;
        }
        .nav-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 4px;
          color: var(--text-muted);
          cursor: pointer;
          font-size: 0.7rem;
          font-weight: bold;
        }
        .nav-item.active { color: var(--primary); }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-overlay.show { display: flex; }
        .spinner { 
            width: 50px; height: 50px; 
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
</div>

<div class="app-container">

    <!-- VIEW 1: CONFIGURATION -->
    <div id="view-config" class="view active">
        <div class="header">
            <i data-lucide="plus-circle"></i>
            <h2>Crear Personaje</h2>
        </div>
        <div class="scroll-content">
            <div class="field" style="text-align: center;">
                <div id="avatar-preview-container" onclick="document.getElementById('ai-image').click()">
                    <span id="preview-placeholder">Toca para subir foto</span>
                    <img id="avatar-preview" src="" alt="Vista previa">
                </div>
                <input type="file" id="ai-image" accept="image/*" style="display: none;" onchange="previewImage(this)">
            </div>
            
            <div class="field">
                <label>Nombre de la IA:</label>
                <input type="text" id="ai-name" placeholder="Ej: Kasandra">
            </div>

            <div class="field">
                <label>Personalidad:</label>
                <textarea id="ai-persona" rows="2" placeholder="Ej: Amigable y atenta"></textarea>
            </div>

            <div class="field">
                <label>Modelos de Texto Disponibles:</label>
                <div id="model-checkbox-container" class="model-checkbox-list"></div>
            </div>

            <hr>
            <span class="section-title">🔊 CONFIGURACIÓN DE VOZ</span>

            <div class="field">
                <label>Voz (Piper Local):</label>
                <select id="voice-select">
                    <optgroup label="Mujeres">
                        <option value="es_MX-claude-high.onnx">🇲🇽 Claude (High)</option>
                        <option value="es_AR-daniela-high.onnx">🇦🇷 Daniela (High)</option>
                    </optgroup>
                    <optgroup label="Hombres">
                        <option value="es_MX-ald-medium.onnx" selected>🇲🇽 Ald (Medium)</option>
                        <option value="es_ES-carlfm-x_low.onnx">🇪🇸 CarlfM (X-Low)</option>
                        <option value="es_ES-davefx-medium.onnx">🇪🇸 DaveFX (Medium)</option>
                    </optgroup>
                </select>
            </div>

            <div class="field">
                <label>Texto de prueba:</label>
                <textarea id="test-text" rows="2" placeholder="Prueba la voz..."></textarea>
            </div>

            <div class="field">
                <label>Velocidad (Rate):</label>
                <div class="range-group">
                    <input type="range" id="voice-rate" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('val-rate').innerText = this.value">
                    <span class="range-val" id="val-rate">1.0</span>
                </div>
            </div>

            <div class="field">
                <label>Tono (Noise Scale):</label>
                <div class="range-group">
                    <input type="range" id="voice-pitch" min="0.1" max="1.5" step="0.05" value="0.667" oninput="document.getElementById('val-pitch').innerText = this.value">
                    <span class="range-val" id="val-pitch">0.667</span>
                </div>
            </div>

            <hr>
            <span class="section-title">⚙️ REGISTRAR MODELO ADICIONAL</span>
            
            <div class="field">
                <label>Nombre del Modelo:</label>
                <input type="text" id="new-model-name" placeholder="Ej: Llama 4 Custom">
            </div>
            <div class="field">
                <label>URL API:</label>
                <input type="text" id="new-model-url" placeholder="https://api.ejemplo.com/v1/chat/completions">
            </div>
            <div class="field">
                <label>API Key:</label>
                <input type="password" id="new-model-apikey" placeholder="sk-...">
            </div>

            <hr>
            <span class="section-title">🚀 ACCIONES</span>

            <button onclick="registrarNuevoModelo()" class="btn btn-secondary" style="width: 100%; margin-bottom: 12px;">
                <i data-lucide="plus"></i> Registrar Modelo
            </button>

            <div class="btn-group">
                <button id="btn-test" class="btn btn-test">
                    <i data-lucide="volume-2"></i> Probar Voz
                </button>
                <button id="btn-save" class="btn btn-primary">
                    <i data-lucide="check-circle"></i> Guardar IA
                </button>
                <button id="btn-download" class="btn btn-secondary" onclick="descargarWav()">
                    <i data-lucide="file-audio"></i> .wav
                </button>
            </div>
            
            <div style="height: 40px;"></div>
        </div>
        
        <div class="nav-footer">
          <div class="nav-item active" onclick="switchView('view-config')">
            <i data-lucide="plus"></i><span>Nuevo</span>
          </div>
          <div class="nav-item" onclick="switchView('view-list')">
            <i data-lucide="users"></i><span>Personajes</span>
          </div>
        </div>
    </div>

    <!-- VIEW 2: BOTS LIST -->
    <div id="view-list" class="view">
        <div class="header">
            <button class="back-btn" onclick="switchView('view-config')"><i data-lucide="arrow-left"></i></button>
            <i data-lucide="users"></i>
            <h2>Mis Personajes</h2>
        </div>
        <div class="scroll-content">
            <div id="bot-list-container" class="bot-list-grid"></div>
        </div>
        <div class="nav-footer">
          <div class="nav-item" onclick="switchView('view-config')">
            <i data-lucide="plus"></i><span>Nuevo</span>
          </div>
          <div class="nav-item active" onclick="switchView('view-list')">
            <i data-lucide="users"></i><span>Personajes</span>
          </div>
        </div>
    </div>

    <!-- VIEW 3: CHAT -->
    <div id="view-chat" class="view">
        <div class="header">
            <button class="back-btn" onclick="switchView('view-list')"><i data-lucide="arrow-left"></i></button>
            <img id="chat-avatar" src="" class="bot-img-mini" style="width: 38px; height: 38px;">
            <div>
                <h2 id="display-name" style="font-size: 1rem; line-height: 1;">IA Chat</h2>
                <span class="online-tag"><span class="online-dot"></span> EN LÍNEA</span>
            </div>
        </div>
        <div id="messages"></div>
        <div class="chat-input-box">
            <input type="text" id="user-input" placeholder="Escribe un mensaje...">
            <button id="btn-enviar" class="btn btn-primary" style="width: auto; padding: 10px 15px;"><i data-lucide="send"></i></button>
        </div>
    </div>

</div>

<script>
    // ==================== CONFIGURACIÓN ====================
    const BACKEND_URL = "https://piper-backend-one.vercel.app";
    const PIPER_SERVER = "https://alejandrott24-piper-tts-server.hf.space/tts";

    // ==================== VARIABLES GLOBALES ====================
    let defaultModels = [];
    let customModels = [];
    let bots = [];
    let selectedModelId = null;
    let currentBot = null;
    let tempImage = "";
    let lastAudioBlob = null;

    lucide.createIcons();

    // ==================== FUNCIONES DE CARGA ====================
    async function cargarModelos() {
        try {
            showLoading();
            const response = await fetch(`${BACKEND_URL}/api/models`);
            const data = await response.json();
            
            if (data.success) {
                defaultModels = data.models.filter(m => !m.is_custom);
                customModels = data.models.filter(m => m.is_custom);
                
                if (defaultModels.length > 0 && !selectedModelId) {
                    selectedModelId = defaultModels[0].id;
                }
                
                renderModelCheckboxes();
            }
        } catch (error) {
            console.error('Error cargando modelos:', error);
            alert('Error al cargar modelos. Verifica tu conexión.');
        } finally {
            hideLoading();
        }
    }

    async function cargarPersonajes() {
        try {
            showLoading();
            const response = await fetch(`${BACKEND_URL}/api/personajes`);
            const data = await response.json();
            
            if (data.success) {
                bots = data.personajes;
                renderBots();
            }
        } catch (error) {
            console.error('Error cargando personajes:', error);
            alert('Error al cargar personajes. Verifica tu conexión.');
        } finally {
            hideLoading();
        }
    }

    // ==================== FUNCIONES DE VISTAS ====================
    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        
        if(viewId === 'view-list') {
            cargarPersonajes();
        }
        
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        if(viewId === 'view-config') {
            document.querySelectorAll('.nav-item')[0].classList.add('active');
        } else if(viewId === 'view-list') {
            document.querySelectorAll('.nav-item')[1].classList.add('active');
        }
        
        lucide.createIcons();
    }

    function showLoading() {
        document.getElementById('loading-overlay').classList.add('show');
    }

    function hideLoading() {
        document.getElementById('loading-overlay').classList.remove('show');
    }

    // ==================== IMAGEN ====================
    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.getElementById('avatar-preview');
                preview.src = e.target.result;
                preview.style.display = 'block';
                document.getElementById('preview-placeholder').style.display = 'none';
                tempImage = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

   // ==================== MODELOS ====================
async function registrarNuevoModelo() {
    const nameInput = document.getElementById('new-model-name');
    const urlInput = document.getElementById('new-model-url');
    const keyInput = document.getElementById('new-model-apikey');

    const name = nameInput.value.trim();
    const url = urlInput.value.trim();
    const apiKey = keyInput.value.trim();
    
    if (!name || !url || !apiKey) {
        alert('Por favor, completa Nombre, URL y API Key.');
        return;
    }

    try {
        showLoading();
        const response = await fetch(`${BACKEND_URL}/api/models`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,
                url: url,
                api_key: apiKey,
                is_custom: true
            })
        });

        const data = await response.json();
        
        if (data.success) {
            alert('✅ Modelo registrado exitosamente');
            nameInput.value = '';
            urlInput.value = '';
            keyInput.value = '';
            await cargarModelos();
        } else {
            alert('❌ Error al registrar modelo: ' + (data.error || 'Desconocido'));
        }
    } catch (error) {
        console.error('Error registrando modelo:', error);
        alert('❌ Error al registrar modelo. Verifica tu conexión.');
    } finally {
        hideLoading();
    }
}

function renderModelCheckboxes() {
    const container = document.getElementById('model-checkbox-container');
    container.innerHTML = '';
    
    const allModels = [...defaultModels, ...customModels];
    
    if (allModels.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:10px;">No hay modelos disponibles</p>';
        return;
    }
    
    allModels.forEach(m => {
        const item = document.createElement('div');
        item.className = 'model-checkbox-item';
        
        const left = document.createElement('div');
        left.className = 'model-checkbox-left';
        left.onclick = () => selectModel(m.id);
        
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'ai-model-selection';
        radio.checked = selectedModelId === m.id;
        radio.onchange = () => selectModel(m.id);
        
        const span = document.createElement('span');
        span.textContent = m.name;
        
        left.appendChild(radio);
        left.appendChild(span);
        item.appendChild(left);

        // Botón de eliminar para TODOS los modelos
        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete';
        delBtn.innerHTML = '<i data-lucide="trash-2" size="14"></i>';
        delBtn.onclick = (e) => {
            e.stopPropagation();
            eliminarModelo(m.id);
        };
        item.appendChild(delBtn);
        
        container.appendChild(item);
    });
    lucide.createIcons();
}

function selectModel(id) {
    selectedModelId = id;
    renderModelCheckboxes();
}

async function eliminarModelo(id) {
    // Validar que no sea el último modelo
    const totalModelos = defaultModels.length + customModels.length;
    if (totalModelos <= 1) {
        return alert('❌ Debes tener al menos un modelo activo');
    }
    
    if (!confirm('¿Eliminar este modelo?')) return;

    try {
        showLoading();
        const response = await fetch(`${BACKEND_URL}/api/models/${id}`, {
            method: 'DELETE'
        });

        const data = await response.json();
        
        if (data.success) {
            // Si eliminaste el modelo seleccionado, seleccionar otro
            if (selectedModelId === id) {
                const remainingModels = [...defaultModels, ...customModels].filter(m => m.id !== id);
                if (remainingModels.length > 0) {
                    selectedModelId = remainingModels[0].id;
                }
            }
            await cargarModelos();
            alert('✅ Modelo eliminado exitosamente');
        } else {
            alert('❌ Error al eliminar modelo');
        }
    } catch (error) {
        console.error('Error eliminando modelo:', error);
        alert('❌ Error al eliminar modelo');
    } finally {
        hideLoading();
    }
}

    // ==================== PERSONAJES ====================
    document.getElementById('btn-save').onclick = async () => {
        const name = document.getElementById('ai-name').value.trim();
        if(!name) return alert("❌ Ponle nombre al personaje");
        
        if(!selectedModelId) return alert("❌ Selecciona un modelo");

        try {
            showLoading();
            const response = await fetch(`${BACKEND_URL}/api/personajes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: name,
                    persona: document.getElementById('ai-persona').value,
                    model_id: selectedModelId,
                    voice: document.getElementById('voice-select').value,
                    rate: document.getElementById('voice-rate').value,
                    pitch: document.getElementById('voice-pitch').value,
                    image_base64: tempImage || null
                })
            });

            const data = await response.json();
            
            if (data.success) {
                alert('✅ Personaje guardado exitosamente');
                document.getElementById('ai-name').value = '';
                document.getElementById('ai-persona').value = '';
                tempImage = '';
                document.getElementById('avatar-preview').style.display = 'none';
                document.getElementById('preview-placeholder').style.display = 'block';
                switchView('view-list');
            } else {
                alert('❌ Error al guardar personaje: ' + (data.error || 'Desconocido'));
            }
        } catch (error) {
            console.error('Error guardando personaje:', error);
            alert('❌ Error al guardar personaje. Verifica tu conexión.');
        } finally {
            hideLoading();
        }
    };

  function renderBots() {
    const container = document.getElementById('bot-list-container');
    container.innerHTML = '';
    
    if (bots.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">No hay personajes creados aún</p>';
        return;
    }
    
    bots.forEach(bot => {
        const el = document.createElement('div');
        el.className = 'bot-item';
        
        // Usar image_url de Supabase o image_base64 como fallback
        const imgSrc = bot.image_url || bot.image_base64 || `https://api.dicebear.com/7.x/bottts/svg?seed=${bot.name}`;
        
        // Crear el contenedor izquierdo
        const leftDiv = document.createElement('div');
        leftDiv.className = 'bot-item-left';
        leftDiv.onclick = () => openChat(bot.id);
        
        leftDiv.innerHTML = `
            <img src="${imgSrc}" class="bot-img-mini" alt="${bot.name}">
            <div class="bot-info-mini">
                <h4>${bot.name}</h4>
                <span class="online-tag"><span class="online-dot"></span> EN LÍNEA</span>
            </div>
        `;
        
        // Crear botón eliminar
        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete';
        delBtn.innerHTML = '<i data-lucide="trash-2" size="18"></i>';
        delBtn.onclick = (e) => deleteBot(e, bot.id);
        
        el.appendChild(leftDiv);
        el.appendChild(delBtn);
        container.appendChild(el);
    });
    lucide.createIcons();
}

async function deleteBot(e, id) {
    e.stopPropagation();
    if (!confirm('¿Eliminar este personaje?')) return;

    try {
        showLoading();
        const response = await fetch(`${BACKEND_URL}/api/personajes/${id}`, {  // ← CORREGIDO: paréntesis en fetch()
            method: 'DELETE'
        });

        const data = await response.json();
        
        if (data.success) {
            await cargarPersonajes();
            alert('✅ Personaje eliminado exitosamente');
        } else {
            alert('❌ Error al eliminar personaje');
        }
    } catch (error) {
        console.error('Error eliminando personaje:', error);
        alert('❌ Error al eliminar personaje');
    } finally {
        hideLoading();
    }
}

function openChat(botId) {
    currentBot = bots.find(b => b.id === botId);
    if (!currentBot) {
        console.error('Bot no encontrado:', botId);
        return;
    }
    
    const imgSrc = currentBot.image_url || currentBot.image_base64 || `https://api.dicebear.com/7.x/bottts/svg?seed=${currentBot.name}`;
    
    document.getElementById('display-name').innerText = currentBot.name;
    document.getElementById('chat-avatar').src = imgSrc;
    document.getElementById('messages').innerHTML = "";
    switchView('view-chat');
}

    // ==================== VOZ ====================
    async function hablar(texto, params = null) {
        if (!texto) return;
        const voiceModel = params?.voice || document.getElementById('voice-select').value;
        const rate = parseFloat(params?.rate || document.getElementById('voice-rate').value);
        const pitch = parseFloat(params?.pitch || document.getElementById('voice-pitch').value);
        
        try {
            const response = await fetch(PIPER_SERVER, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: texto, 
                    model: voiceModel, 
                    length_scale: 1 / rate, 
                    noise_scale: pitch
                })
            });
            const data = await response.json();
            const audioData = atob(data.audio);
            const arrayBuffer = new Uint8Array(audioData.length);
            for (let i = 0; i < audioData.length; i++) arrayBuffer[i] = audioData.charCodeAt(i);
            
            lastAudioBlob = new Blob([arrayBuffer], { type: 'audio/wav' });
            const audio = new Audio(URL.createObjectURL(lastAudioBlob));
            await audio.play();
        } catch (err) { 
            console.error("Error Piper:", err); 
            alert('❌ Error al generar audio');
        }
    }

    function descargarWav() {
        if (!lastAudioBlob) return alert("⚠️ Primero genera un audio probando la voz");
        const a = document.createElement('a');
        a.href = URL.createObjectURL(lastAudioBlob);
        a.download = `piper_audio_${Date.now()}.wav`;
        a.click();
    }

    document.getElementById('btn-test').onclick = () => {
        const texto = document.getElementById('test-text').value || "Probando la voz de Piper.";
        hablar(texto);
    };

    // ==================== CHAT ====================
    async function enviar() {
        const input = document.getElementById('user-input');
        const texto = input.value.trim();
        if (!texto) return;

        const messagesContainer = document.getElementById('messages');
        const userDiv = document.createElement('div');
        userDiv.className = 'msg user-msg'; 
        userDiv.innerText = texto;
        messagesContainer.appendChild(userDiv);
        input.value = "";

        const iaDiv = document.createElement('div');
        iaDiv.className = 'msg ia-msg'; 
        iaDiv.innerText = "⏳ Pensando...";
        messagesContainer.appendChild(iaDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
            // Obtener configuración del modelo
            const modelConfig = [...defaultModels, ...customModels].find(m => m.id === currentBot.model_id);
            
            if (!modelConfig) {
                throw new Error("Modelo no encontrado");
            }

            const systemPrompt = `Eres ${currentBot.name}. Personalidad: ${currentBot.persona}. Habla de forma natural y conversacional.`;

            const response = await fetch(`${BACKEND_URL}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model_id: currentBot.model_id,
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: texto }
                    ]
                })
            });

            const data = await response.json();
            
            if (data.success) {
                const resTxt = data.response;
                iaDiv.innerText = resTxt;
                
                // Hablar con la voz configurada del bot
                hablar(resTxt, {
                    voice: currentBot.voice,
                    rate: currentBot.rate,
                    pitch: currentBot.pitch
                });
            } else {
                iaDiv.innerText = "❌ Error: " + (data.error || 'Error desconocido');
            }
        } catch (e) { 
            iaDiv.innerText = "❌ Error: " + e.message; 
            console.error('Error en chat:', e);
        }
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    document.getElementById('btn-enviar').onclick = enviar;
    document.getElementById('user-input').onkeypress = (e) => { 
        if(e.key === 'Enter') enviar(); 
    };
    
    // ==================== INICIALIZACIÓN ====================
    window.onload = async () => { 
        lucide.createIcons();
        await cargarModelos();
        await cargarPersonajes();
        
        if(bots.length > 0) {
            switchView('view-list'); 
        }
    };
</script>
</body>
</html>
