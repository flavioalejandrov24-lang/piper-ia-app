<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configura tu IA con Piper</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #764ba2;
            --primary-light: #8e63cf;
            --success: #25d366;
            --bg-gradient: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            padding: 15px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: var(--shadow);
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .view {
            display: none;
            flex-direction: column;
            height: 100%;
            animation: fadeIn 0.3s ease;
        }
        .view.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            padding: 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.8);
            flex-shrink: 0;
        }
        .header h2 { margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--text-main); }
        
        .back-btn { 
            background: #f1f5f9; border: none; cursor: pointer; padding: 8px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); transition: all 0.2s;
        }
        .back-btn:hover { background: var(--border); color: var(--primary); }

        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: thin;
        }

        .field { margin-bottom: 15px; }
        label { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-main); }
        input, textarea, select { 
            width: 100%; padding: 12px; border: 1.5px solid var(--border); 
            border-radius: 10px; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
            background: white;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); }

        .range-group { 
            background: #f8fafc; padding: 10px; border-radius: 10px; 
            display: flex; align-items: center; gap: 12px; margin-top: 4px;
        }
        .range-group input { flex: 1; padding: 0; height: 5px; cursor: pointer; appearance: none; background: #cbd5e1; border: none; }
        .range-group input::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; background: var(--primary); border-radius: 50%; cursor: pointer; }
        .range-group input::-moz-range-thumb { width: 16px; height: 16px; background: var(--primary); border-radius: 50%; cursor: pointer; border: none; }
        .range-val { min-width: 40px; font-size: 0.85rem; color: var(--primary); font-weight: 800; text-align: right; }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 0.8rem;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-test { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
        .btn-test:hover { background: #bbf7d0; }
        .btn-primary { background: #22c55e; color: white; }
        .btn-primary:hover { background: #16a34a; }
        .btn-secondary { background: #e9d5ff; color: #9333ea; border: 1px solid #d8b4fe; }
        .btn-secondary:hover { background: #ddd6fe; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #avatar-preview-container { 
            width: 110px; height: 110px; margin: 0 auto 15px; 
            border: 3px dashed var(--border); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; cursor: pointer; position: relative;
            background: white;
        }
        #avatar-preview { width: 100%; height: 100%; object-fit: cover; display: none; }
        #preview-placeholder { color: var(--text-muted); text-align: center; font-size: 0.75rem; padding: 10px; }

        .bot-list-grid { display: flex; flex-direction: column; gap: 12px; }
        
        .bot-item {
            background: #fff; 
            border: 1.5px solid var(--border); 
            border-radius: 15px;
            padding: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 12px;
            transition: 0.2s; 
            position: relative;
        }
        .bot-item:hover { border-color: var(--primary); background: #fdfaff; }
        
        .bot-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }

        .bot-item-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-edit {
            background: #dbeafe;
            color: #2563eb;
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-edit:hover { background: #bfdbfe; transform: scale(1.1); }

        .bot-img-mini { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); flex-shrink: 0; }
        .bot-info-mini { flex: 1; }
        .bot-info-mini h4 { margin: 0; font-size: 1rem; color: var(--text-main); }
        .online-tag { font-size: 0.7rem; color: var(--success); display: flex; align-items: center; gap: 4px; font-weight: bold; }
        .online-dot { width: 7px; height: 7px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }
        
        .btn-delete { 
            background: #fee2e2; 
            color: #ef4444; 
            border: none; 
            padding: 8px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-delete:hover { background: #fecaca; transform: scale(1.1); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        #messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            background: #f8fafc;
            position: relative;
        }
        
        #messages::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.08;
            z-index: 0;
            pointer-events: none;
        }
        
        .msg { 
            max-width: 80%; 
            padding: 12px 16px; 
            border-radius: 16px; 
            font-size: 0.95rem; 
            line-height: 1.4;
            position: relative;
            z-index: 1;
        }
        .user-msg { align-self: flex-end; background: #0084ff; color: white; border-bottom-right-radius: 4px; }
        .ia-msg { align-self: flex-start; background: #e2e8f0; color: var(--text-main); border-bottom-left-radius: 4px; }

        .chat-input-box {
            padding: 15px; border-top: 1px solid var(--border);
            display: flex; gap: 10px; background: #fff;
        }

        hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
        .section-title { color: var(--primary); font-size: 0.8rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 15px; display: block; }
        
        .nav-footer {
          padding: 10px 20px;
          border-top: 1px solid var(--border);
          display: flex;
          justify-content: space-around;
          background: #fff;
          flex-shrink: 0;
        }
        .nav-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 4px;
          color: var(--text-muted);
          cursor: pointer;
          font-size: 0.7rem;
          font-weight: bold;
        }
        .nav-item.active { color: var(--primary); }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-overlay.show { display: flex; }
        .spinner { 
            width: 50px; height: 50px; 
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
</div>

<div class="app-container">

    <!-- VIEW 1: CONFIGURATION -->
    <div id="view-config" class="view active">
        <div class="header">
            <i data-lucide="plus-circle"></i>
            <h2>Crear Personaje</h2>
        </div>
        <div class="scroll-content">
            <div class="field" style="text-align: center;">
                <div id="avatar-preview-container" onclick="document.getElementById('ai-image').click()">
                    <span id="preview-placeholder">Toca para subir foto</span>
                    <img id="avatar-preview" src="" alt="Vista previa">
                </div>
                <input type="file" id="ai-image" accept="image/*" style="display: none;" onchange="previewImage(this)">
            </div>
            
            <div class="field">
                <label>Nombre de la IA:</label>
                <input type="text" id="ai-name" placeholder="Ej: Kasandra">
            </div>

            <div class="field">
                <label>Personalidad:</label>
                <textarea id="ai-persona" rows="2" placeholder="Ej: Amigable y atenta"></textarea>
            </div>

            <hr>
            <span class="section-title">🔊 CONFIGURACIÓN DE VOZ</span>

            <div class="field">
                <label>Voz (Piper Local):</label>
                <select id="voice-select">
                    <optgroup label="Mujeres">
                        <option value="es_MX-claude-high.onnx">🇲🇽 Claude (High)</option>
                        <option value="es_AR-daniela-high.onnx">🇦🇷 Daniela (High)</option>
                    </optgroup>
                    <optgroup label="Hombres">
                        <option value="es_ES-carlfm-x_low.onnx">🇪🇸 CarlfM (X-Low)</option>
                        <option value="es_ES-davefx-medium.onnx">🇪🇸 DaveFX (Medium)</option>
                    </optgroup>
                </select>
            </div>

            <div class="field">
                <label>Texto de prueba:</label>
                <textarea id="test-text" rows="2" placeholder="Prueba la voz..."></textarea>
            </div>

            <div class="field">
                <label>Velocidad (Rate):</label>
                <div class="range-group">
                    <input type="range" id="voice-rate" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('val-rate').innerText = this.value">
                    <span class="range-val" id="val-rate">1.0</span>
                </div>
            </div>

            <div class="field">
                <label>Tono (Noise Scale):</label>
                <div class="range-group">
                    <input type="range" id="voice-pitch" min="0.1" max="1.5" step="0.05" value="0.667" oninput="document.getElementById('val-pitch').innerText = this.value">
                    <span class="range-val" id="val-pitch">0.667</span>
                </div>
            </div>

            <hr>
            <span class="section-title">🚀 ACCIONES</span>

            <div class="btn-group">
                <button id="btn-test" class="btn btn-test">
                    <i data-lucide="volume-2"></i> Probar Voz
                </button>
                <button id="btn-save" class="btn btn-primary">
                    <i data-lucide="check-circle"></i> <span id="btn-save-text">Crear Avatar</span>
                </button>
                <button id="btn-download" class="btn btn-secondary" onclick="descargarWav()">
                    <i data-lucide="file-audio"></i> .wav
                </button>
            </div>
            
            <div style="height: 40px;"></div>
        </div>
        
        <div class="nav-footer">
          <div class="nav-item active" onclick="switchView('view-config')">
            <i data-lucide="plus"></i><span>Nuevo</span>
          </div>
          <div class="nav-item" onclick="switchView('view-list')">
            <i data-lucide="users"></i><span>Personajes</span>
          </div>
        </div>
    </div>

    <!-- VIEW 2: BOTS LIST -->
    <div id="view-list" class="view">
        <div class="header">
            <button class="back-btn" onclick="switchView('view-config')"><i data-lucide="arrow-left"></i></button>
            <i data-lucide="users"></i>
            <h2>Mis Personajes</h2>
        </div>
        <div class="scroll-content">
            <div id="bot-list-container" class="bot-list-grid"></div>
        </div>
        <div class="nav-footer">
          <div class="nav-item" onclick="switchView('view-config')">
            <i data-lucide="plus"></i><span>Nuevo</span>
          </div>
          <div class="nav-item active" onclick="switchView('view-list')">
            <i data-lucide="users"></i><span>Personajes</span>
          </div>
        </div>
    </div>

    <!-- VIEW 3: CHAT -->
    <div id="view-chat" class="view">
        <div class="header">
            <button class="back-btn" onclick="switchView('view-list')"><i data-lucide="arrow-left"></i></button>
            <img id="chat-avatar" src="" class="bot-img-mini" style="width: 38px; height: 38px;">
            <div>
                <h2 id="display-name" style="font-size: 1rem; line-height: 1;">IA Chat</h2>
                <span class="online-tag"><span class="online-dot"></span> EN LÍNEA</span>
            </div>
        </div>
        <div id="messages"></div>
        <div class="chat-input-box">
            <input type="text" id="user-input" placeholder="Escribe un mensaje...">
            <button id="btn-enviar" class="btn btn-primary" style="width: auto; padding: 10px 15px;"><i data-lucide="send"></i></button>
        </div>
    </div>

</div>

<script>
    // ==================== ⚙️ CONFIGURACIÓN - INGRESA AQUÍ TUS CREDENCIALES ====================
    
    // 🔑 SUPABASE - Ingresa tu URL y KEY aquí:
    const SUPABASE_URL = "https://bmnmfpxorpkksczdewnp.supabase.co";  // ← Ejemplo: "https://xxxxx.supabase.co"
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtbm1mcHhvcnBra3NjemRld25wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5NjQ4NjAsImV4cCI6MjA4MjU0MDg2MH0.2XctteSjqD_zZG5w9HqUk2h9wNH5JTF8KvhLq0gf3zY";  // ← Tu clave anónima de Supabase
    
    // 🎤 PIPER TTS Server (HuggingFace)
    const PIPER_SERVER = "https://alejandrott24-piper-tts-server.hf.space/tts";

    // 🤖 CONFIGURACIÓN DE IAs (Ya están precargadas con tus datos)
    const AI_MODELS = [
        {
            id: 'f4a1726c-bf13-4043-ad2e-80fbbfdcee47',
            name: 'Groq Llama 3.3',
            url: 'https://api.groq.com/openai/v1/chat/completions',
            api_key: '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',
            model: 'llama-3.3-70b-versatile',
            type: 'openai' // Compatible con OpenAI API
        },
        {
            id: '2c4c1ce6-a3ec-4250-950d-abcc2cb104dc',
            name: 'Gemini 2.5 Flash',
            url: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent',
            api_key: 'AIzaSyCi90bHv0AMNRhO9lifcrHiSv5HNuTY9iA',
            model: 'gemini-2.0-flash-exp',
            type: 'gemini' // Formato especial de Gemini
        },
        {
            id: '2038e354-8818-4dee-bfdf-98ab9bd3ac8a',
            name: 'Olmos IA',
            url: 'https://openrouter.ai/api/v1/chat/completions',
            api_key: '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',
            model: 'allenai/olmo-2-1124-13b-instruct',
            type: 'openai'
        },
        {
            id: '672b0388-9831-4b64-999f-1c38a3864b7a',
            name: 'Gemma Local',
            url: 'https://alejandrott24-mi-gemma-servidor.hf.space',
            api_key: 'No-key',
            model: 'gemma',
            type: 'custom' // Servidor personalizado
        }
    ];

    // ==================== VARIABLES GLOBALES ====================
    let supabase = null;
    let bots = [];
    let currentBot = null;
    let tempImage = "";
    let lastAudioBlob = null;
    let currentModelIndex = 0; // Para rotación de IAs
    let editingBotId = null; // Para saber si estamos editando

    // ==================== INICIALIZACIÓN ====================
    function initSupabase() {
        if (!SUPABASE_URL || !SUPABASE_ANON_KEY || 
            SUPABASE_URL === "TU_SUPABASE_URL_AQUI" || 
            SUPABASE_ANON_KEY === "TU_SUPABASE_ANON_KEY_AQUI") {
            console.error('❌ ERROR: Debes configurar SUPABASE_URL y SUPABASE_ANON_KEY en el código');
            alert('⚠️ Configuración incompleta: Debes agregar tus credenciales de Supabase en el código (líneas 342-343)');
            return false;
        }
        
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase inicializado correctamente');
        return true;
    }

    // ==================== FUNCIONES DE CARGA ====================
    async function cargarPersonajes() {
        if (!supabase) {
            console.error('Supabase no está inicializado');
            return;
        }
        
        try {
            showLoading();
            const { data, error } = await supabase
                .from('personajes')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) throw error;
            
            bots = data || [];
            renderBots();
            console.log(`✅ ${bots.length} personajes cargados`);
        } catch (error) {
            console.error('Error cargando personajes:', error);
            alert('❌ Error al cargar personajes: ' + error.message);
        } finally {
            hideLoading();
        }
    }

    // ==================== FUNCIONES DE VISTAS ====================
    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        
        if(viewId === 'view-list') {
            cargarPersonajes();
        }
        
        if(viewId === 'view-config' && editingBotId === null) {
            limpiarFormulario();
        }
        
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        if(viewId === 'view-config') {
            document.querySelectorAll('.nav-item')[0].classList.add('active');
        } else if(viewId === 'view-list') {
            document.querySelectorAll('.nav-item')[1].classList.add('active');
        }
        
        lucide.createIcons();
    }

    function showLoading() {
        document.getElementById('loading-overlay').classList.add('show');
    }

    function hideLoading() {
        document.getElementById('loading-overlay').classList.remove('show');
    }

    // ==================== IMAGEN ====================
    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.getElementById('avatar-preview');
                preview.src = e.target.result;
                preview.style.display = 'block';
                document.getElementById('preview-placeholder').style.display = 'none';
                tempImage = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // ==================== PERSONAJES ====================
    document.getElementById('btn-save').onclick = async () => {
        const name = document.getElementById('ai-name').value.trim();
        if(!name) return alert("❌ Ponle nombre al personaje");
        
        if (!supabase) {
            alert('⚠️ Supabase no está configurado. Revisa las credenciales en el código.');
            return;
        }

        try {
            showLoading();
            
            const personajeData = {
                name: name,
                persona: document.getElementById('ai-persona').value,
                voice: document.getElementById('voice-select').value,
                rate: parseFloat(document.getElementById('voice-rate').value),
                pitch: parseFloat(document.getElementById('voice-pitch').value),
                image_base64: tempImage || null,
                model_id: null,
                model_name: null
            };
            
            if (editingBotId) {
                // ACTUALIZAR personaje existente
                const { data, error } = await supabase
                    .from('personajes')
                    .update(personajeData)
                    .eq('id', editingBotId)
                    .select();

                if (error) throw error;
                alert('✅ Personaje actualizado exitosamente');
            } else {
                // CREAR nuevo personaje
                const { data, error } = await supabase
                    .from('personajes')
                    .insert([personajeData])
                    .select();

                if (error) throw error;
                alert('✅ Personaje creado exitosamente');
            }
            
            // Limpiar formulario
            limpiarFormulario();
            switchView('view-list');
            
        } catch (error) {
            console.error('Error guardando personaje:', error);
            alert('❌ Error al guardar personaje: ' + error.message);
        } finally {
            hideLoading();
        }
    };

    function limpiarFormulario() {
        document.getElementById('ai-name').value = '';
        document.getElementById('ai-persona').value = '';
        document.getElementById('voice-rate').value = '1.0';
        document.getElementById('val-rate').innerText = '1.0';
        document.getElementById('voice-pitch').value = '0.667';
        document.getElementById('val-pitch').innerText = '0.667';
        tempImage = '';
        document.getElementById('avatar-preview').style.display = 'none';
        document.getElementById('preview-placeholder').style.display = 'block';
        editingBotId = null;
        document.getElementById('btn-save-text').innerText = 'Crear Avatar';
        document.querySelector('#view-config .header h2').innerText = 'Crear Personaje';
    }

    function renderBots() {
        const container = document.getElementById('bot-list-container');
        container.innerHTML = '';
        
        if (bots.length === 0) {
            container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">No hay personajes creados aún</p>';
            return;
        }
        
        bots.forEach(bot => {
            const el = document.createElement('div');
            el.className = 'bot-item';
            
            const imgSrc = bot.image_url || bot.image_base64 || `https://api.dicebear.com/7.x/bottts/svg?seed=${bot.name}`;
            
            const leftDiv = document.createElement('div');
            leftDiv.className = 'bot-item-left';
            leftDiv.onclick = () => openChat(bot.id);
            
            leftDiv.innerHTML = `
                <img src="${imgSrc}" class="bot-img-mini" alt="${bot.name}">
                <div class="bot-info-mini">
                    <h4>${bot.name}</h4>
                    <span class="online-tag"><span class="online-dot"></span> EN LÍNEA</span>
                </div>
            `;
            
            // Contenedor de acciones
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'bot-item-actions';
            
            // Botón editar
            const editBtn = document.createElement('button');
            editBtn.className = 'btn-edit';
            editBtn.innerHTML = '<i data-lucide="edit-2" size="18"></i>';
            editBtn.onclick = (e) => {
                e.stopPropagation();
                editarBot(bot.id);
            };
            
            // Botón eliminar
            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.innerHTML = '<i data-lucide="trash-2" size="18"></i>';
            delBtn.onclick = (e) => deleteBot(e, bot.id);
            
            actionsDiv.appendChild(editBtn);
            actionsDiv.appendChild(delBtn);
            
            el.appendChild(leftDiv);
            el.appendChild(actionsDiv);
            container.appendChild(el);
        });
        lucide.createIcons();
    }

    function editarBot(botId) {
        const bot = bots.find(b => b.id === botId);
        if (!bot) return;
        
        editingBotId = botId;
        
        // Cargar datos en el formulario
        document.getElementById('ai-name').value = bot.name;
        document.getElementById('ai-persona').value = bot.persona || '';
        document.getElementById('voice-select').value = bot.voice;
        document.getElementById('voice-rate').value = bot.rate || 1.0;
        document.getElementById('val-rate').innerText = bot.rate || 1.0;
        document.getElementById('voice-pitch').value = bot.pitch || 0.667;
        document.getElementById('val-pitch').innerText = bot.pitch || 0.667;
        
        // Cargar imagen si existe
        if (bot.image_url || bot.image_base64) {
            const imgSrc = bot.image_url || bot.image_base64;
            document.getElementById('avatar-preview').src = imgSrc;
            document.getElementById('avatar-preview').style.display = 'block';
            document.getElementById('preview-placeholder').style.display = 'none';
            tempImage = bot.image_base64 || '';
        }
        
        // Cambiar textos
        document.getElementById('btn-save-text').innerText = 'Actualizar';
        document.querySelector('#view-config .header h2').innerText = 'Editar Personaje';
        
        switchView('view-config');
    }

    async function deleteBot(e, id) {
        e.stopPropagation();
        if (!confirm('¿Eliminar este personaje?')) return;
        
        try {
            showLoading();
            const { error } = await supabase
                .from('personajes')
                .delete()
                .eq('id', id);
            
            if (error) throw error;
            
            await cargarPersonajes();
            alert('✅ Personaje eliminado exitosamente');
        } catch (error) {
            console.error('Error eliminando personaje:', error);
            alert('❌ Error al eliminar personaje: ' + error.message);
        } finally {
            hideLoading();
        }
    }

    function openChat(botId) {
        currentBot = bots.find(b => b.id === botId);
        if (!currentBot) {
            console.error('Bot no encontrado:', botId);
            return;
        }
        
        const imgSrc = currentBot.image_url || currentBot.image_base64 || `https://api.dicebear.com/7.x/bottts/svg?seed=${currentBot.name}`;
        
        document.getElementById('display-name').innerText = currentBot.name;
        document.getElementById('chat-avatar').src = imgSrc;
        document.getElementById('messages').innerHTML = "";
        
        // Establecer imagen de fondo en el chat
        const messagesContainer = document.getElementById('messages');
        messagesContainer.style.setProperty('--chat-bg-image', `url(${imgSrc})`);
        const styleEl = document.querySelector('#messages::before') || document.createElement('style');
        if (!styleEl.id) {
            styleEl.id = 'chat-bg-style';
            document.head.appendChild(styleEl);
        }
        styleEl.textContent = `#messages::before { background-image: url("${imgSrc}") !important; }`;
        
        // Resetear índice de modelo para nueva conversación
        currentModelIndex = Math.floor(Math.random() * AI_MODELS.length);
        
        switchView('view-chat');
    }

    // ==================== VOZ ====================
    async function hablar(texto, params = null) {
        if (!texto) return;
        const voiceModel = params?.voice || document.getElementById('voice-select').value;
        const rate = parseFloat(params?.rate || document.getElementById('voice-rate').value);
        const pitch = parseFloat(params?.pitch || document.getElementById('voice-pitch').value);
        
        try {
            const response = await fetch(PIPER_SERVER, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: texto, 
                    model: voiceModel, 
                    length_scale: 1 / rate, 
                    noise_scale: pitch
                })
            });
            
            if (!response.ok) throw new Error('Error en servidor Piper');
            
            const data = await response.json();
            const audioData = atob(data.audio);
            const arrayBuffer = new Uint8Array(audioData.length);
            for (let i = 0; i < audioData.length; i++) arrayBuffer[i] = audioData.charCodeAt(i);
            
            lastAudioBlob = new Blob([arrayBuffer], { type: 'audio/wav' });
            const audio = new Audio(URL.createObjectURL(lastAudioBlob));
            await audio.play();
        } catch (err) { 
            console.error("Error Piper:", err); 
            alert('❌ Error al generar audio: ' + err.message);
        }
    }

    function descargarWav() {
        if (!lastAudioBlob) return alert("⚠️ Primero genera un audio probando la voz");
        const a = document.createElement('a');
        a.href = URL.createObjectURL(lastAudioBlob);
        a.download = `piper_audio_${Date.now()}.wav`;
        a.click();
    }

    document.getElementById('btn-test').onclick = () => {
        const texto = document.getElementById('test-text').value || "Probando la voz de Piper.";
        hablar(texto);
    };

    // ==================== CHAT CON ROTACIÓN DE IAs ====================
    
    // 🔄 Función para obtener el siguiente modelo (rotación con failover)
    function getNextModel() {
        const model = AI_MODELS[currentModelIndex];
        currentModelIndex = (currentModelIndex + 1) % AI_MODELS.length;
        return model;
    }

    // 🤖 Llamada a IA con formato OpenAI
    async function llamarIAOpenAI(model, systemPrompt, userMessage) {
        const response = await fetch(model.url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${model.api_key}`
            },
            body: JSON.stringify({
                model: model.model,
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userMessage }
                ],
                temperature: 0.7,
                max_tokens: 500
            })
        });

        if (!response.ok) {
            throw new Error(`Error ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        return data.choices[0].message.content;
    }

    // 🤖 Llamada a IA con formato Gemini
    async function llamarIAGemini(model, systemPrompt, userMessage) {
        const response = await fetch(`${model.url}?key=${model.api_key}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{
                        text: `${systemPrompt}\n\nUsuario: ${userMessage}`
                    }]
                }],
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 500
                }
            })
        });

        if (!response.ok) {
            throw new Error(`Error ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
    }

    // 🤖 Llamada a IA Custom (Gemma Local u otros)
    async function llamarIACustom(model, systemPrompt, userMessage) {
        const response = await fetch(`${model.url}/generate`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                prompt: `${systemPrompt}\n\nUsuario: ${userMessage}`,
                max_tokens: 500,
                temperature: 0.7
            })
        });

        if (!response.ok) {
            throw new Error(`Error ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        return data.generated_text || data.response || data.text;
    }

    // 🔄 Función principal con failover automático
    async function enviarMensajeConFailover(systemPrompt, userMessage, intentosMaximos = AI_MODELS.length) {
        let ultimoError = null;
        
        for (let i = 0; i < intentosMaximos; i++) {
            const model = getNextModel();
            
            try {
                console.log(`🤖 Intentando con: ${model.name}`);
                
                let respuesta;
                if (model.type === 'gemini') {
                    respuesta = await llamarIAGemini(model, systemPrompt, userMessage);
                } else if (model.type === 'custom') {
                    respuesta = await llamarIACustom(model, systemPrompt, userMessage);
                } else {
                    respuesta = await llamarIAOpenAI(model, systemPrompt, userMessage);
                }
                
                console.log(`✅ Respuesta exitosa de: ${model.name}`);
                return respuesta;
                
            } catch (error) {
                console.error(`❌ Error con ${model.name}:`, error.message);
                ultimoError = error;
                
                // Si no es el último intento, continuar con el siguiente modelo
                if (i < intentosMaximos - 1) {
                    console.log(`🔄 Rotando a siguiente modelo...`);
                    continue;
                }
            }
        }
        
        // Si todos los modelos fallaron
        throw new Error(`Todos los modelos fallaron. Último error: ${ultimoError.message}`);
    }

    // 💬 Función de envío de mensaje
    async function enviar() {
        const input = document.getElementById('user-input');
        const texto = input.value.trim();
        if (!texto) return;

        const messagesContainer = document.getElementById('messages');
        const userDiv = document.createElement('div');
        userDiv.className = 'msg user-msg'; 
        userDiv.innerText = texto;
        messagesContainer.appendChild(userDiv);
        input.value = "";

        const iaDiv = document.createElement('div');
        iaDiv.className = 'msg ia-msg'; 
        iaDiv.innerText = "⏳ Pensando...";
        messagesContainer.appendChild(iaDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
            const systemPrompt = `Eres ${currentBot.name}. Personalidad: ${currentBot.persona}.

NO HACER:
- NO uses asteriscos (*) para acciones o sonidos (nada en la conversación)
- No uses emojis en ninguna conversación por ningún motivo
- Evita usar ASTERISCOS o EMOJIS a toda costa
- No responder más de 3 párrafos

SÍ HACER:
- Palabras en efectos de sonido como (gluck, slurp), repítelas de 3 a 5 veces, siempre con ... (Tres puntos suspensivos entre una y otra)
- Ejemplo: (Slurp...slurp...slurp...), (gluck...gluck...gluck...)
- Habla de forma natural y conversacional, sin marcadores de acción
- Responde en español (o el idioma que te hable el usuario)
- Sé coherente con tu personalidad establecida
- Usa acentos, pausas y reglas gramaticales adecuadas
- Acciones o actos, escríbelos en manuscrita y comillas
- Para formatos donde representas habla, hazlo en mayúsculas
- Utiliza gestos o acciones expresivas, como uso de signos de admiración (cuando la escena lo amerite)
- Sé breve y conciso en tus respuestas (máximo 3 párrafos)
- Mantén coherencia con tu personalidad en toda la conversación`;
            
            // 🔄 Llamar con rotación automática y failover
            const respuesta = await enviarMensajeConFailover(systemPrompt, texto);
            
            iaDiv.innerText = respuesta;
            
            // 🎤 Hablar con la voz configurada del bot
            hablar(respuesta, {
                voice: currentBot.voice,
                rate: currentBot.rate,
                pitch: currentBot.pitch
            });
            
        } catch (error) { 
            iaDiv.innerText = "❌ Error: " + error.message;
            console.error('Error en chat:', error);
        }
        
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    document.getElementById('btn-enviar').onclick = enviar;
    document.getElementById('user-input').onkeypress = (e) => { 
        if(e.key === 'Enter') enviar(); 
    };
    
    // ==================== INICIALIZACIÓN ====================
    window.onload = async () => { 
        lucide.createIcons();
        
        if (!initSupabase()) {
            console.error('⚠️ No se pudo inicializar Supabase');
            return;
        }
        
        await cargarPersonajes();
        
        if(bots.length > 0) {
            switchView('view-list'); 
        }
        
        console.log('✅ Aplicación lista');
        console.log(`🤖 ${AI_MODELS.length} modelos de IA disponibles`);
    };
</script>
